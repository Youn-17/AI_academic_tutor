<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="guardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- card background (readable on light and dark themes) -->
  <rect x="1" y="1" width="898" height="468" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="40" font-size="17" font-weight="700" fill="#0f172a">Governable agent ecosystem</text>
  <text x="40" y="62" font-size="12.5" fill="#64748b">Eleven learning-science roles in two archetypes, all bound by one governance layer that keeps the learner the author of their knowledge.</text>

  <!-- archetype headers -->
  <text x="130" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="0.4">LEARNING COMPANIONS</text>
  <text x="770" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#059669" letter-spacing="0.4">INSTRUCTIONAL ASSISTANTS</text>

  <!-- connectors guardrail -> roles -->
  <g fill="none" stroke="#c7d2fe" stroke-width="2">
    <path id="L1" d="M366,252 C295,252 300,152 220,152"/>
    <path id="L2" d="M366,260 C300,260 300,208 220,208"/>
    <path id="L3" d="M366,266 C300,266 290,264 220,264"/>
    <path id="L4" d="M366,272 C300,272 300,320 220,320"/>
    <path id="L5" d="M366,280 C295,280 300,376 220,376"/>
    <path id="R1" d="M534,252 C605,252 600,152 680,152"/>
    <path id="R2" d="M534,260 C600,260 600,208 680,208"/>
    <path id="R3" d="M534,266 C600,266 610,264 680,264"/>
    <path id="R4" d="M534,272 C600,272 600,320 680,320"/>
    <path id="R5" d="M534,280 C605,280 600,376 680,376"/>
    <path id="DF" d="M450,312 L450,356"/>
  </g>

  <!-- Learning Companions (blue) -->
  <g>
    <rect x="40" y="132" width="180" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><circle cx="58" cy="152" r="4" fill="#2563eb"/><text x="72" y="156" font-size="12.5" font-weight="600" fill="#0f172a">Socratic Tutor</text>
    <rect x="40" y="188" width="180" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><circle cx="58" cy="208" r="4" fill="#2563eb"/><text x="72" y="212" font-size="12.5" font-weight="600" fill="#0f172a">Devil's Advocate</text>
    <rect x="40" y="244" width="180" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><circle cx="58" cy="264" r="4" fill="#2563eb"/><text x="72" y="268" font-size="12.5" font-weight="600" fill="#0f172a">Metacognitive Coach</text>
    <rect x="40" y="300" width="180" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><circle cx="58" cy="320" r="4" fill="#2563eb"/><text x="72" y="324" font-size="12.5" font-weight="600" fill="#0f172a">Affective Support</text>
    <rect x="40" y="356" width="180" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><circle cx="58" cy="376" r="4" fill="#2563eb"/><text x="72" y="380" font-size="12.5" font-weight="600" fill="#0f172a">Learning Companion</text>
  </g>

  <!-- Instructional Assistants (emerald) -->
  <g>
    <rect x="680" y="132" width="180" height="40" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/><circle cx="698" cy="152" r="4" fill="#059669"/><text x="712" y="156" font-size="12.5" font-weight="600" fill="#0f172a">Paper Feedback</text>
    <rect x="680" y="188" width="180" height="40" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/><circle cx="698" cy="208" r="4" fill="#059669"/><text x="712" y="212" font-size="12.5" font-weight="600" fill="#0f172a">Concept Explainer</text>
    <rect x="680" y="244" width="180" height="40" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/><circle cx="698" cy="264" r="4" fill="#059669"/><text x="712" y="268" font-size="12.5" font-weight="600" fill="#0f172a">Practice Quizzer</text>
    <rect x="680" y="300" width="180" height="40" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/><circle cx="698" cy="320" r="4" fill="#059669"/><text x="712" y="324" font-size="12.5" font-weight="600" fill="#0f172a">Course Tutor</text>
    <rect x="680" y="356" width="180" height="40" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/><circle cx="698" cy="376" r="4" fill="#059669"/><text x="712" y="380" font-size="12.5" font-weight="600" fill="#0f172a">Coding Tutor</text>
  </g>

  <!-- Default Tutor (slate) -->
  <rect x="375" y="356" width="150" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/><circle cx="393" cy="376" r="4" fill="#64748b"/><text x="407" y="380" font-size="12.5" font-weight="600" fill="#0f172a">Default Tutor</text>

  <!-- governance pulse rings -->
  <circle cx="450" cy="266" r="48" fill="none" stroke="#6366f1" stroke-width="2">
    <animate attributeName="r" values="48;128" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="266" r="48" fill="none" stroke="#6366f1" stroke-width="2">
    <animate attributeName="r" values="48;128" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Governance Guardrail (center) -->
  <rect x="366" y="220" width="168" height="92" rx="16" fill="url(#guardFill)" stroke="#4f46e5" stroke-width="1.8"/>
  <path d="M450,231 l11,4 v7 c0,7 -4,11 -11,14 c-7,-3 -11,-7 -11,-14 v-7 z" fill="#4f46e5"/>
  <path d="M445,242 l3,3 l6,-6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Governance Guardrail</text>
  <text x="450" y="294" text-anchor="middle" font-size="10.5" fill="#6366f1">epistemic agency</text>

  <!-- governance "touch" dots sweeping out to each role -->
  <g fill="#6366f1">
    <circle r="4"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#L1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#L2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#L3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#L4"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#L5"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.15s" repeatCount="indefinite"><mpath xlink:href="#R1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.45s" repeatCount="indefinite"><mpath xlink:href="#R2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.75s" repeatCount="indefinite"><mpath xlink:href="#R3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="1.05s" repeatCount="indefinite"><mpath xlink:href="#R4"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="1.35s" repeatCount="indefinite"><mpath xlink:href="#R5"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#DF"/></animateMotion></circle>
  </g>
</svg>

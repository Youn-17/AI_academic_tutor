name: Deploy code-interpreter backend

# Auto-deploys the Cloud Run backend whenever code-interpreter/ changes on main.
# Runs on GitHub's US runners → reaches Google APIs / Docker Hub / PyPI fine (no GFW).
# One-time setup needed (repo secrets): GCP_SA_KEY (service-account JSON) + GCP_PROJECT.
on:
  push:
    branches: [main]
    paths: ['code-interpreter/**']
  workflow_dispatch: {}   # also lets you deploy on-demand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ci-backend \
            --source code-interpreter \
            --project "${{ secrets.GCP_PROJECT }}" \
            --region asia-east1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi --cpu 1 --timeout 300
          # env vars (E2B_API_KEY / SUPABASE_* / ALLOWED_ORIGINS) are PRESERVED on the
          # service across deploys, so we don't repeat them here (keeps secrets out of CI).

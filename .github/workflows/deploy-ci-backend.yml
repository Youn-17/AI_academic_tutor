name: Deploy code-interpreter backend

# Auto-deploys the Cloud Run backend whenever code-interpreter/ changes on main.
# Runs on GitHub's US runners → reaches Google APIs / Docker Hub / PyPI fine (no GFW).
# One-time setup needed (repo secrets): GCP_SA_KEY (service-account JSON) + GCP_PROJECT.
on:
  push:
    branches: [main]
    paths: ['code-interpreter/**']
  workflow_dispatch: {}   # also lets you deploy on-demand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          # GCP_SA_KEY_B64 = base64 of the service-account JSON. base64 is a single line
          # and paste-safe, unlike the raw multi-line JSON which gets mangled in the secret field.
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
          gcloud run deploy ci-backend \
            --source code-interpreter \
            --project "${{ secrets.GCP_PROJECT }}" \
            --region asia-east1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi --cpu 1 --timeout 300
          rm -f "$RUNNER_TEMP/sa.json"
          # env vars (E2B_API_KEY / SUPABASE_* / ALLOWED_ORIGINS) are PRESERVED on the
          # service across deploys, so we don't repeat them here.
